name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to upload assets to, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build macOS updater artifacts
        run: npx electron-builder --mac zip --x64 --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: |
            release/latest-mac.yml
            release/lyria-studio-mac-x64.zip
            release/lyria-studio-mac-x64.zip.blockmap
            release/lyria-studio-mac-arm64.zip
            release/lyria-studio-mac-arm64.zip.blockmap
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build Windows updater artifacts
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: |
            release/latest.yml
            release/lyria-studio-win-x64.exe
            release/lyria-studio-win-x64.exe.blockmap
          fail_on_unmatched_files: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - run: npm ci
      - run: npm run build

      - name: Build Linux updater artifacts
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish never

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: |
            release/latest-linux.yml
            release/lyria-studio-linux-x86_64.AppImage
            release/lyria-studio-linux-x86_64.AppImage.blockmap
            release/lyria-studio-linux-amd64.deb
            release/lyria-studio-linux-x86_64.rpm
          fail_on_unmatched_files: true
